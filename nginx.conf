server {
    listen       80;
    server_name  localhost;

    charset utf-8;

    # 后端 API 代理（端口 8080）
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 手机端 - 根路径
    location / {
        root   C:/Users/weili/Desktop/ParkingSystem/parking-client/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理端 - /admin/ 路径
    location /admin/ {
        alias  C:/Users/weili/Desktop/ParkingSystem/parking-admin/dist/;
        index  index.html;
        try_files $uri $uri/ /admin/index.html;
    }
}
